// Classes the Compose compiler cannot infer as stable because they come from modules it does
// not compile (engine-core is plain Kotlin/JVM, java.time is the JDK). Each is an immutable
// value type of primitives: compared with equals() when a composable skips. DSL models with
// lists (CollectionProperties, Material, …) stay out: they are immutable and keep their
// identity, so strong skipping's identity check is both correct and cheaper than equals().
