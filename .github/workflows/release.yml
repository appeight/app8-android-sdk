name: Release

# Pushing a version tag (`0.4.0`; `v0.4.0` is accepted too) publishes that version to
# GitHub Packages and creates the GitHub release. `/release` pushes the tag; the annotated
# tag's message becomes the release notes.
on:
  push:
    tags: ["v*", "[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub release
  packages: write # GitHub Packages

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Self-hosted Mac (moonlander): the Android SDK lives in the runner
      # user's home, and the work folder persists between runs, so sibling
      # checkouts from an earlier run are removed before they are fetched.
      - name: Prepare the Mac runner
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          # Three runners share this Mac's home. With one ~/.gradle, the daemon
          # clean-up at the end of one job stopped the daemons of the jobs still
          # running ("Gradle build daemon has been stopped: stop command
          # received"). Each runner has its own Gradle home, seeded once from
          # ~/.gradle so the first build does not download every dependency.
          gradle_home="$HOME/.gradle-runners/$RUNNER_NAME"
          if [ ! -d "$gradle_home" ]; then
            mkdir -p "$gradle_home/caches"
            for item in wrapper caches/modules-2 gradle.properties init.d; do
              if [ -e "$HOME/.gradle/$item" ]; then cp -cR "$HOME/.gradle/$item" "$gradle_home/$item"; fi
            done
          fi
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
          rm -rf "$GITHUB_WORKSPACE/../app8-dsl"

      # checkout can leave a shallow, dereferenced tag; fetch the annotated tag object for its notes.
      - name: Fetch the annotated tag
        run: git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Tag equals EngineVersion.CURRENT; app8-dsl tag exists
        run: scripts/check-version.sh --release "$TAG"

      - name: Check out app8-dsl at dsl.lock
        run: scripts/fetch-dsl.sh --strict "$GITHUB_WORKSPACE/../app8-dsl"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21  # JDK 20+ BreakIterator follows Unicode extended grapheme clusters, like Swift Characters

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Self-hosted Mac: the Gradle home persists between runs, and uploading it to the
          # Actions cache over the slow uplink stalled jobs for half an hour.
          cache-disabled: true

      - name: Verify
        run: ./gradlew :engine-core:test :engine:testDebugUnitTest apiCheck

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is"
            exit 0
          fi
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          fi
